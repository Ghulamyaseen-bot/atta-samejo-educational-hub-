name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Education Hub APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check project
        run: |
          echo "Checking project..."
          ls -la
          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Install missing react-is dependency
        run: |
          npm install react-is --save --legacy-peer-deps

      - name: Build web application
        run: |
          npm run build

          if [ ! -d dist ]; then
            echo "ERROR: dist folder not generated"
            exit 1
          fi

      - name: Setup Capacitor
        run: |
          npm install --no-save --legacy-peer-deps \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7

      - name: Configure Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.attasamejo.educationhub",
            "appName": "ATTA SAMEJO Education Hub",
            "webDir": "dist"
          }
          EOF
          fi

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK generated successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Atta-Samejo-Education-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
