name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Web and Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check project files
        run: |
          echo "Checking repository files..."
          ls -la
          echo "Finding package.json files..."
          find . -maxdepth 5 -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*'

      - name: Set up pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            npm install
          elif [ -f package.json ]; then
            npm install
          else
            echo "ERROR: No package.json found in repository root."
            exit 1
          fi

      - name: Build web application
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run build
          elif [ -f package.json ]; then
            npm run build
          else
            echo "ERROR: Cannot find package.json."
            exit 1
          fi
