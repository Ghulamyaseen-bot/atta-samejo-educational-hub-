name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ATTA SAMEJO Educational Hub APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build web application
        run: npm run build

      - name: Remove existing Capacitor configuration
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.json

      - name: Create Capacitor JSON configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.attasamejo.educationalhub",
            "appName": "ATTA SAMEJO EDUCATIONAL HUB",
            "webDir": "dist"
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync Android
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATTA-SAMEJO-Educational-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
